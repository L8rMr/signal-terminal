name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: pip install -r requirements.txt pytest pyflakes
      - name: Lint Python
        run: pyflakes server.py brief.py schwab.py market_functions.py tests
      - name: Check JavaScript syntax
        run: for f in static/*.js; do node --check "$f"; done
      - name: Tests
        run: pytest -q tests
