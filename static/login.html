<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Signal | Owner sign-in</title><link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#090c10;--panel:#101419;--line:#29313a;--muted:#8c98a7;--text:#e2e7ed;--orange:#ffa23b;--green:#64d5ac}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.5 Arial,Helvetica,sans-serif}
.box{width:min(440px,92vw);border:1px solid var(--line);background:var(--panel)}
.head{padding:14px 18px;border-bottom:1px solid var(--line);font:700 14px monospace;background:#191f27}.head span{color:var(--orange);margin-right:10px}
.body{padding:20px 18px;display:grid;gap:14px}label{font:12px monospace;color:var(--muted)}
input{width:100%;background:#0b0e12;border:1px solid var(--line);color:var(--text);padding:10px;font:14px monospace}
button{background:#201b13;border:1px solid var(--orange);color:var(--orange);padding:10px;font:700 13px monospace;cursor:pointer}
#msg{font:12px monospace;min-height:1.5em;color:var(--muted)}#msg.err{color:#ff7a6b}#msg.ok{color:var(--green)}
a{color:var(--orange)}
</style></head><body>
<form class="box" id="f"><div class="head"><span>SIGNAL</span>OWNER SIGN-IN</div><div class="body">
<p style="margin:0;color:var(--muted)">The owner view adds live brokerage quotes and editing. Visitors don't need this: <a href="/">open the public terminal</a>.</p>
<label for="k">OWNER KEY</label><input id="k" autocomplete="current-password" type="password" required>
<button>SIGN IN</button><div id="msg" role="status"></div></div></form>
<script>
const f=document.getElementById('f'),k=document.getElementById('k'),msg=document.getElementById('msg');
async function signIn(key){
  msg.className='';msg.textContent='Checking…';
  const r=await fetch('/api/owner/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key}),credentials:'same-origin'});
  if(r.ok){msg.className='ok';msg.textContent='Signed in. Opening the terminal…';setTimeout(()=>location.replace('/'),500)}
  else{msg.className='err';msg.textContent=(await r.json().catch(()=>({}))).error||'Sign-in failed.'}
}
f.addEventListener('submit',e=>{e.preventDefault();signIn(k.value.trim())});
// The owner link carries the key in the #fragment, which browsers never send to the server or logs.
const m=location.hash.match(/key=([^&]+)/);if(m){history.replaceState(null,'','/login');signIn(decodeURIComponent(m[1]))}
</script></body></html>
